<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Login</title>
    <link rel="shortcut icon" href="./assets/join-favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="../css/menu/style.css">
    <link rel="stylesheet" href="./css/index/style.css"/>
    <script src="./js/Templates/init.js"></script>
    <script src="./js/login/login.js"></script>
  </head>

  <body>
  <div class="page login-page">
      <div class="app-intro" aria-hidden="true">
        <div class="join-logo" aria-label="Join logo">
          <picture>
            <source media="(max-width: 768px)" srcset="./assets/join-logo.svg" />
            <img class="join-preview" src="./img/icons/join_icon.png" alt="Join logo" />
          </picture>
        </div>
      </div>

      <header class="page-header">
        <div class="header-icon-wrapper">
          <img class="header-icon" src="./img/icons/join_icon.png" alt="Join icon" />
        </div>
        <div class="header-actions">
          <span class="header-copy">Not a Join user?</span>
          <button type="button" class="top-link">Sign up</button>
        </div>
      </header>

      <div class="panel-area">
        <main class="login-shell">
          <section class="content-card" aria-labelledby="login-title">
            <h1 id="login-title" class="login-title">Log in</h1>

            <form id="demo-login-form" class="login-form" novalidate>
              <div class="field input-with-icon">
                <input id="demo-login-name" type="text" placeholder="Name" aria-label="Name for demo login" aria-describedby="demo-login-feedback" autocomplete="name" />
                <img src="./img/icons/mail.png" alt="Mail icon" class="input-icon" />
              </div>
              <div class="field input-with-icon">
                <input type="password" placeholder="Password" aria-label="Password (not checked or saved in demo)" autocomplete="off" />
                <img src="./img/icons/lock.png" alt="Lock icon" class="input-icon" />
              </div>
              <p id="demo-login-feedback" class="demo-login-feedback" aria-live="polite"></p>

              <div class="button-row">
                <button type="submit" class="btn btn--primary">Log in</button>
                <button id="guest-login-button" type="button" class="btn btn--secondary">Guest Log in</button>
              </div>
            </form>
          </section>
        </main>
      </div>

      <div class="mobile-bottom-area">
        <section class="mobile-signup-cta" aria-label="Signup Hinweis mobil">
          <span class="mobile-signup-copy">Not a Join user?</span>
          <button type="button" class="top-link">Sign up</button>
        </section>

        <footer class="footer">
          <a href="./pages/privacy-notice.html">Privacy Policy</a>
          <a href="./pages/legal-notice.html">Legal notice</a>
        </footer>
      </div>
    </div>





  </body>









</html>
