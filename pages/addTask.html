<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/addTask.css" />
    <script src="../js/Templates/init.js"></script>
    <title>Join - Add Task</title>
  </head>
  <body onload="init()">

    <main>
      <section class="add-task-content">
        <h1>Add Task</h1>
        <form class="add-task-form" novalidate>
          <div class="form-columns">
            <div class="form-column-left">
              <div class="form-field">
                <label for="taskTitle">Title<span class="required-star">*</span></label>
                <input id="taskTitle" type="text" placeholder="Enter a title" />
                <span class="field-error"></span>
              </div>

              <div class="form-field">
                <label for="taskDescription">Description</label>
                <textarea id="taskDescription" placeholder="Enter a Description"></textarea>
              </div>

              <div class="form-field">
                <label for="taskDueDate">Due date<span class="required-star">*</span></label>
                <div class="input-with-icon">
                  <input id="taskDueDate" type="text" placeholder="dd/mm/yyyy" />
                  <img src="../assets/calendar.svg" alt="" />
                </div>
                <span class="field-error"></span>
              </div>
            </div>
            <div class="form-column-right">
              <div class="form-field">
                <p class="field-label">Priority</p>
                <div class="priority-options">
                  <button type="button" class="priority-btn priority-urgent">
                    Urgent <img src="../assets/priorityUrgent.svg" alt="" />
                  </button>
                  <button type="button" class="priority-btn priority-medium priority-active">
                    Medium <img src="../assets/mediumWhite.svg" alt="" />
                  </button>
                  <button type="button" class="priority-btn priority-low">
                    Low <img src="../assets/low.svg" alt="" />
                  </button>
                </div>
              </div>
              <div class="form-field">
                <p class="field-label">Assigned to</p>
                <div class="dropdown">
                  <div class="dropdown-toggle">
                    <input
                      id="assignedToInput"
                      type="text"
                      placeholder="Select contacts to assign"
                    />
                    <img src="../assets/arrowdropdown.svg" alt="" />
                  </div>
                  <ul class="dropdown-list"></ul>
                </div>
                <div class="assigned-avatars"></div>
              </div>
              <div class="form-field">
                <p class="field-label">Category<span class="required-star">*</span></p>
                <div class="dropdown">
                  <div class="dropdown-toggle">
                    <input id="categoryInput" type="text" placeholder="Select task category" />
                    <img src="../assets/arrowdropdown.svg" alt="" />
                  </div>
                  <ul class="dropdown-list">
                    <li>Technical Task</li>
                    <li>User Story</li>
                  </ul>
                </div>
              </div>
              <div class="form-field">
                <p class="field-label">Subtasks</p>
                <div class="input-with-icon">
                  <input id="subtaskInput" type="text" placeholder="Add new subtask" />
                  <div class="subtask-actions">
                    <img src="../assets/close.svg" alt="" />
                    <span class="action-divider"></span>
                    <img src="../assets/check.svg" alt="" />
                  </div>
                </div>
                <ul class="subtask-list"></ul>
              </div>
            </div>
          </div>

          <div class="form-footer">
            <p class="required-hint">
              <span class="required-star">*</span>This field is required
            </p>
            <div class="form-actions">
              <button type="button" class="btn-clear">
                Clear <span class="icon-close"></span>
              </button>
              <button type="submit" class="btn-create">
                Create Task <span class="icon-check"></span>
              </button>
            </div>
          </div>
        </form>
      </section>
      <div id="taskToast" class="toast">
        <span>Task added to board</span>
        <img src="../assets/boardWhite.svg" alt="" />
      </div>
    </main>
  </body>
</html>
