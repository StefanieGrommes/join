<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/menu/style.css">
    <link rel="stylesheet" href="../css/summary.css">
    <script src="../js/Templates/profileMenu.js"></script>
    <script src="../js/Templates/init.js"></script>
    <title>Join - Summary</title>
</head>

<body>

    <main class="summary">
        <div class="task-boxes-and-summary-header">
            <header class="summary-header">
                <h1>Join 360</h1>
                <div class="blue-separator"></div>
                <h5>Key Metrics at a Glance</h5>
                <div class="blue-separator-mobile"></div>
            </header>
            <div class="boxes-and-welcome-message">
                <div class="task-boxes">
                    <div tabindex="0" role="button" id="to-do" class="grey-boxes-task flex-row">
                        <div class="task-boxes-img-wrapper">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="69" height="69" fill="none"
                                class="task-icon-to-do" viewBox="0 0 69 69">
                                <circle cx="34.5" cy="34.5" r="34.5" fill="#2a3647" />
                                <mask id="mask0_508097_4020" width="33" height="33" x="18" y="18"
                                    maskUnits="userSpaceOnUse" style="mask-type:alpha">
                                    <path fill="#d9d9d9" d="M18.5 18.5h32v32h-32z" />
                                </mask>
                                <g mask="url(#mask0_508097_4020)">
                                    <path fill="#fff"
                                        d="M25.167 43.833h1.866l11.5-11.5-1.866-1.866-11.5 11.5zM44.233 30.4l-5.666-5.6 1.866-1.867q.767-.766 1.884-.767 1.116 0 1.883.767l1.867 1.867q.765.766.8 1.85a2.4 2.4 0 0 1-.734 1.85zM42.3 32.367 28.167 46.5H22.5v-5.667L36.633 26.7z" />
                                </g>
                            </svg>
                        </div>
                        <div class="task-name-and-amount">
                            <p class="amount-bold">0</p>
                            <p class="task-normal">To Do</p>
                        </div>
                    </div>
                    <div tabindex="0" role="button" id="done" class="grey-boxes-task flex-row">
                        <div class="task-boxes-img-wrapper">
                            <svg aria-hidden="true" focusable="false"class="task-icon-done" width="69" height="69" viewBox="0 0 69 69" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <circle cx="34.5" cy="34.5" r="34.5" fill="#2A3647" />
                                <path d="M19.5283 34.5001L30.7571 45.5662L49.4717 23.4341" stroke="white"
                                    stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <div class="task-name-and-amount">
                            <p class="amount-bold">0</p>
                            <p class="task-normal">Done</p>
                        </div>
                    </div>
                    <div tabindex="0" role="button" id="urgent-and-calendar"
                        class="grey-boxes-task urgent-and-calendar">
                        <div class="urgent-and-seperator">
                            <div class="urgent flex-row">
                                <div class="task-boxes-img-wrapper">
                                    <img src="../assets/urgent.svg" alt="arrow showing up">
                                </div>
                                <div class="task-name-and-amount">
                                    <span class="amount-bold">0</span>
                                    <span class="normal-text">Urgent</span>
                                </div>
                            </div>
                            <div class="grey-separator"></div>
                        </div>
                        <div class="calendar">
                            <p class="date" id="upcoming-deadline"></p>
                            <p class="normal-text">Upcoming Deadline</p>
                        </div>
                    </div>
                    <div tabindex="0" role="button" id="tasks-in-board" class="grey-boxes-task task-name-and-amount">
                        <span class="amount-bold">0</span>
                        <span class="task-normal">Tasks in <br> Board</span>
                    </div>
                    <div tabindex="0" role="button" id="tasks-in-progress" class="grey-boxes-task task-name-and-amount">
                        <span class="amount-bold">0</span>
                        <span class="task-normal">Tasks in <br> Progress</span>
                    </div>
                    <div tabindex="0" role="button" id="awaiting-feedback" class="grey-boxes-task task-name-and-amount">
                        <span class="amount-bold">0</span>
                        <span class="task-normal">Awaiting <br> Feedback</span>
                    </div>
                </div>

                <div id="welcome-message" class="welcome-message">
                    <h2 class="daytime" id="daytime"></h2>
                    <p class="name" id="username" hidden></p>
                </div>
            </div>
        </div>
    </main>
<script src="../js/board/boardData.js"></script>
<script src="../js/summary/summary.js"></script>
<script src="../js/contactList.js"></script>
</body>


</html>
