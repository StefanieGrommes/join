<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/contacts.css" />
    <script src="../js/Templates/init.js"></script>
    <title>Join - Contacts</title>
  </head>
  <body
    onload="
      init();
      renderContactList();
    "
  >
    <main>
      <section class="add-task-content">
        <div class="form-column-left">
          <button class="add-contact-btn">
            Add new contact
            <img class="icon-add" src="../assets/person_add.svg" alt="" />
          </button>
          <div class="contact-list-wrapper" id="contactListWrapper"></div>
        </div>

        <div class="form-column-right">
          <div class="title">
            <button class="back-btn" onclick="closeContactDetail()">
              <img src="../assets/arrow-left-line.svg" alt="Back" />
            </button>
            <h1>Contacts</h1>
            <p>Better with a team</p>
          </div>
          <div id="contactDetail"></div>
        </div>
      </section>
    </main>

    <script src="../js/data/contacts.js"></script>
    <script src="../js/contactList.js"></script>
    <script src="../js/contacts/contacts.js"></script>
  </body>
</html>
