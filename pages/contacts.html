<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/contacts.css" />
    <script src="../js/Templates/init.js"></script>
    <title>Join - Contacts</title>
  </head>
  <body onload="init()">
    <main>
      <section class="add-task-content">
        <div class="form-column-left">
          <button class="add-contact-btn">
            Add new contact
            <img class="icon-add" src="../assets/person_add.svg" alt="" />
          </button>
          <div class="contact-list-wrapper">
            <div class="contact-group">
              <p class="group-letter">A</p>
              <ul class="contact-list">
                <li class="contact-item">
                  <div class="contact-avatar" style="background-color: rgb(255, 122, 0)">
                    AM
                  </div>
                  <div class="contact-info">
                    <p class="contact-name">Anton Meyer</p>
                    <a href="mailto:antonm@gmail.com" class="contact-email"
                      >antonm@gmail.com</a
                    >
                  </div>
                </li>

                <li class="contact-item">
                  <div class="contact-avatar" style="background-color: rgb(147, 39, 255)">
                    AS
                  </div>
                  <div class="contact-info">
                    <p class="contact-name">Anja Schulz</p>
                    <a href="mailto:schulz@hotmail.com" class="contact-email"
                      >schulz@hotmail.com</a
                    >
                  </div>
                </li>
              </ul>
            </div>
            <div class="contact-group">
              <p class="group-letter">B</p>
              <ul class="contact-list">
                <li class="contact-item">
                  <div class="contact-avatar" style="background-color: rgb(110, 82, 255)">
                    BZ
                  </div>
                  <div class="contact-info">
                    <p class="contact-name">Benedict Ziegler</p>
                    <a href="mailto:benedikt@gmail.com" class="contact-email"
                      >benedikt@gmail.com</a
                    >
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="form-column-right">
          <div class="title">
            <h1>Contacts</h1>
            <p>Better with a team</p>
          </div>
          <div class="contact-detail">
            <div class="contact-avatar-large" style="background-color: rgb(255, 122, 0)">
              AM
            </div>
            <div class="contact-detail-head">
              <p class="contact-detail-name">Anton Meyer</p>
              <div class="contact-detail-actions">
                <button class="detail-action-btn">
                  <img src="../assets/edit.svg" alt="" /> Edit
                </button>
                <button class="detail-action-btn">
                  <img src="../assets/delete.svg" alt="" /> Delete
                </button>
              </div>
            </div>
          </div>

          <p class="section-label">Contact Information</p>

          <div class="contact-detail-field">
            <p class="detail-label">Email</p>
            <a href="mailto:anton@gmail.com" class="contact-email">anton@gmail.com</a>
          </div>

          <div class="contact-detail-field">
            <p class="detail-label">Phone</p>
            <p>+491111 111 111 1</p>
          </div>
        </div>
      </section>
    </main>
  </body>
  <script src="../js/contacts/contacts.js"></script>
</html>
