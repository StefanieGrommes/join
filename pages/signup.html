<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join - Sign up</title>
  <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/menu/style.css">
  <link rel="stylesheet" href="../css/signup/style.css" />
  <script src="../js/Templates/init.js"></script>
</head>

<body>

  <div class="page signup-page">
    <header class="page-header">
      <img class="header-icon" src="../img/icons/join_icon.png" alt="Join icon" />
    </header>
    <div class="panel-area">
      <main class="auth-panel">
        <section class="content-card" aria-labelledby="signup-title">
          <form id="signup-form" class="signup-form" novalidate>
            <button class="back-button" type="button" aria-label="Back to login" onclick="window.location.href='../index.html'">

              <img src="../assets/arrow-left-default.png" alt="back arrow">
            </button>
            <h1 id="signup-title" class="signup-title">Sign up</h1>
            <div class="fields-container">
              <div class="field input-with-icon">
                <input id="signup-name" type="text" placeholder="Name" name="name" autocomplete="name"
                  aria-label="Name" aria-describedby="signup-feedback" />
                <img src="../img/icons/person(1).png" alt="Person icon" class="input-icon" />
              </div>

              <div class="field input-with-icon">
                <input id="signup-email" type="email" placeholder="Email" name="email"
                  autocomplete="email" aria-label="Email" aria-describedby="signup-feedback" />
                <img src="../img/icons/mail.png" alt="Mail icon" class="input-icon" />
              </div>

              <div class="field input-with-icon">
                <input id="signup-password" type="password" placeholder="Password" name="password"
                  autocomplete="new-password" aria-label="Password" aria-describedby="signup-feedback" />
                <img src="../img/icons/lock.png" alt="Lock icon" class="input-icon" />
              </div>
              <div class="field input-with-icon">
                <input id="signup-confirm-password" type="password" placeholder="Confirm Password"
                  name="confirmPassword" autocomplete="new-password" aria-label="Confirm Password" aria-describedby="signup-feedback" />
                <img src="../img/icons/lock.png" alt="Lock icon" class="input-icon" />
              </div>
              <div id="signup-feedback" class="signup-password-error" aria-live="polite"></div>
              <div class="checkbox-line">
                <input id="privacy-policy-checkbox" type="checkbox" />
                <span><label for="privacy-policy-checkbox">I accept the</label> <a href="../pages/privacy-notice.html">Privacy policy</a></span>
              </div>
              <button id="signup-submit-button" type="submit" class="btn btn--primary" disabled>Sign up</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <div class="mobile-bottom-area">
      <footer class="footer">
        <a href="./privacy-notice.html">Privacy Policy</a>
        <a href="./legal-notice.html">Legal notice</a>
      </footer>
    </div>
  </div>

  <div id="signup-success-overlay" class="signup-success-overlay" hidden>
    <div class="signup-success-message" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

<script src="../js/auth/users.js"></script>
<script src="../js/signup/signup.js"></script>
</body>

</html>
