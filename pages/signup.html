<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join - Sign up</title>
  <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/signup.css" />
  <script src="../js/Templates/init.js"></script>
</head>

<body>

  <div class="page signup-page">
    <header class="page-header">
      <img class="header-icon" src="../img/icons/join_icon.png" alt="Join icon" />
    </header>
    <div class="panel-area">
      <main class="auth-panel">
        <section class="content-card" aria-labelledby="signup-title">
          <form id="signup-form" class="signup-form" novalidate>
            <button class="back-button" onclick="history.back()">

              <img src="../assets/arrow-left-default.png" alt="back arrow">
            </button>
            <h1 id="signup-title" class="signup-title">Sign up</h1>
            <div class="fields-container">
              <div class="field input-with-icon">
                <input id="signup-name" type="text" placeholder="Name" name="name" />
                <img src="../img/icons/person(1).png" alt="Person icon" class="input-icon" />
              </div>

              <div class="field input-with-icon">
                <input id="signup-email" type="email" placeholder="Email" name="email" />
                <img src="../img/icons/mail.png" alt="Mail icon" class="input-icon" />
              </div>

              <div class="field input-with-icon">
                <input id="signup-password" type="password" placeholder="Password" name="password" />
                <img src="../img/icons/lock.png" alt="Lock icon" class="input-icon" />
              </div>

              <div class="field input-with-icon">
                <input id="signup-confirm-password" type="password" placeholder="Confirm Password"
                  name="confirmPassword" />
                <img src="../img/icons/lock.png" alt="Lock icon" class="input-icon" />
              </div>

              <div class="checkbox-line">
                <input id="privacy-policy-checkbox" type="checkbox" />
                <span>I accept the <a href="../pages/privacy-notice.html">Privacy policy</a></span>
              </div>
            </div>
            <button id="signup-submit-button" type="submit" class="btn btn--primary" disabled>Sign up</button>
          </form>
        </section>
      </main>
    </div>
    <div class="mobile-bottom-area">
      <footer class="footer">
        <a href="../archive/legacy-pages/pages/privacy-notice-logged-in.html">Privacy Policy</a>
        <a href="../archive/legacy-pages/pages/legal-notice-logged-in.html">Legal notice</a>
      </footer>
    </div>
  </div>

</body>
<script src="../js/signup/signup.js"></script>
</html>
