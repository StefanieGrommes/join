<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join - Board</title>
  <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/menu/style.css">
  <link rel="stylesheet" href="../css/addTask/style.css" />
  <link rel="stylesheet" href="../css/board/style.css" />
  <script src="../js/Templates/profileMenu.js"></script>
  <script src="../js/Templates/init.js"></script>
</head>

<body onload="init()">
  <div class="page-layout">

    <main aria-label="Board Content">
      <section class="board-header-container" aria-label="Board header container">
        <div class="board-header-inner">
          <h1 class="board-header-title">Board</h1>
          <div class="board-header-actions" aria-label="Board actions">
            <div class="board-search-field">
              <input type="text" placeholder="Find Task" aria-label="Find task" />
              <span class="board-search-divider" aria-hidden="true"></span>
              <button class="board-search-button" type="button" aria-label="Search">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <circle cx="11" cy="11" r="6"></circle>
                  <path d="M16 16l4 4"></path>
                </svg>
              </button>
            </div>
            <button id="board-open-add-task-modal" class="board-add-task-button" type="button" aria-label="Add task">
              Add task
              <span class="board-add-task-plus">+</span>
            </button>
          </div>
        </div>
        <div class="board-header-columns" aria-label="Board columns header">
          <div class="board-header-column">
            <div class="board-column-title">
              <span>To do</span>
              <button type="button" data-column="todo" aria-label="Add To do">+</button>
            </div>
          </div>

          <div class="board-header-column">
            <div class="board-column-title">
              <span>In progress</span>
              <button type="button" data-column="in-progress" aria-label="Add In progress">+</button>
            </div>
          </div>

          <div class="board-header-column">
            <div class="board-column-title">
              <span>Await feedback</span>
              <button type="button" data-column="await-feedback" aria-label="Add Await feedback">+</button>
            </div>
          </div>

          <div class="board-header-column">
            <div class="board-column-title">
              <span>Done</span>
            </div>
          </div>
        </div>
      </section>
      <section class="board-main-container" aria-label="Board main container">
        <div class="board-main-column" data-column="todo" aria-label="Todo column"></div>
        <div class="board-main-column" data-column="in-progress" aria-label="In progress column"></div>
        <div class="board-main-column" data-column="await-feedback" aria-label="Await feedback column"></div>
        <div class="board-main-column extra-done" data-column="done" aria-label="Done column"></div>
      </section>
    </main>
  </div>
  <div class="board-mobile-top-nav" aria-label="Mobile top navigation">
    <div class="board-mobile-logo-wrapper">
      <img src="../assets/join-favicon.svg" alt="Join logo" />
    </div>
    <button class="board-mobile-profile-button" type="button" aria-label="Profile">
      <svg class="board-mobile-profile-circle" width="56" height="56" viewBox="0 0 56 56" fill="none"
        xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="28" cy="28" r="26.5" stroke="#2A3647" stroke-width="3" />
      </svg>
    </button>
  </div>
  <div id="board-add-task-modal" class="board-task-modal" inert>
    <div class="board-task-dialog" role="dialog" aria-modal="true" aria-labelledby="board-task-dialog-title">
      <div class="board-task-header">
        <h2 id="board-task-dialog-title">Add Task</h2>
        <button id="board-task-close-button" class="board-task-close" type="button"
          aria-label="Close add task dialog">×</button>
      </div>
      <form id="add-task-form" class="add-task-form" novalidate>
        <div class="form-columns">
          <div class="form-column-left">
            <div class="form-field">
              <label for="task-title">Title<span class="required-star">*</span></label>
              <input id="task-title" type="text" placeholder="Enter a title" />
              <span class="field-error"></span>
            </div>
            <div class="form-field">
              <label for="task-description">Description</label>
              <textarea id="task-description" placeholder="Enter a Description"></textarea>
            </div>
            <div class="form-field">
              <label for="taskDueDate">Due date<span class="required-star">*</span></label>
              <div class="input-with-icon">
                <input onfocus="getTodaysDate()" id="taskDueDate" type="date" max="2030-12-31" />
                <img src="../assets/calendar.svg" alt="" />
              </div>
              <span class="field-error"></span>
            </div>
          </div>
          <div class="form-column-right">
            <div class="form-field">
              <p class="field-label">Priority</p>
              <div class="priority-options">
                <button type="button" class="priority-btn priority-urgent">
                  Urgent
                  <svg class="priority-btn-svg" width="20" height="15" viewBox="0 0 20 15" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M18.9043 14.5096C18.6696 14.51 18.4411 14.4351 18.2522 14.2961L10.0001 8.21288L1.74809 14.2961C1.63224 14.3816 1.50066 14.4435 1.36086 14.4783C1.22106 14.513 1.07577 14.5199 0.933305 14.4986C0.790837 14.4772 0.653973 14.428 0.530528 14.3538C0.407083 14.2796 0.299474 14.1818 0.213845 14.0661C0.128216 13.9503 0.0662437 13.8188 0.0314671 13.6791C-0.00330956 13.5394 -0.0102098 13.3943 0.0111604 13.2519C0.0543195 12.9644 0.21001 12.7058 0.443982 12.533L9.34809 5.96249C9.53679 5.8229 9.76536 5.74756 10.0001 5.74756C10.2349 5.74756 10.4635 5.8229 10.6522 5.96249L19.5563 12.533C19.7422 12.6699 19.8801 12.862 19.9503 13.0819C20.0204 13.3018 20.0193 13.5382 19.9469 13.7573C19.8746 13.9765 19.7349 14.1673 19.5476 14.3024C19.3604 14.4375 19.1352 14.51 18.9043 14.5096Z"
                      fill="#FF3D00" />
                    <path
                      d="M18.9043 8.76057C18.6696 8.76097 18.4411 8.68612 18.2522 8.54702L10.0002 2.46386L1.7481 8.54702C1.51412 8.71983 1.22104 8.79269 0.93331 8.74956C0.645583 8.70643 0.386785 8.55086 0.213849 8.31706C0.0409137 8.08326 -0.0319941 7.79039 0.011165 7.50288C0.054324 7.21536 0.210015 6.95676 0.443986 6.78395L9.3481 0.213471C9.5368 0.0738799 9.76537 -0.00146484 10.0002 -0.00146484C10.2349 -0.00146484 10.4635 0.0738799 10.6522 0.213471L19.5563 6.78395C19.7422 6.92087 19.8801 7.11298 19.9503 7.33286C20.0204 7.55274 20.0193 7.78914 19.947 8.00832C19.8746 8.22751 19.7349 8.41826 19.5476 8.55335C19.3604 8.68844 19.1352 8.76096 18.9043 8.76057Z"
                      fill="#FF3D00" />
                  </svg>
                </button>
                <button type="button" class="priority-btn priority-medium priority-active">
                  Medium
                  <svg class="priority-btn-svg priority-active-svg" width="20" height="8" viewBox="0 0 20 8" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M18.9041 7.45086H1.09589C0.805242 7.45086 0.526498 7.33456 0.320979 7.12755C0.11546 6.92054 0 6.63977 0 6.34701C0 6.05425 0.11546 5.77349 0.320979 5.56647C0.526498 5.35946 0.805242 5.24316 1.09589 5.24316H18.9041C19.1948 5.24316 19.4735 5.35946 19.679 5.56647C19.8845 5.77349 20 6.05425 20 6.34701C20 6.63977 19.8845 6.92054 19.679 7.12755C19.4735 7.33456 19.1948 7.45086 18.9041 7.45086Z"

                      fill="rgb(255,168,0)" />
                  </svg>
                </button>
                <button type="button" class="priority-btn priority-low">
                  Low
                  <svg class="priority-btn-svg" width="20" height="15" viewBox="0 0 20 15" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M10 8.76077C9.7654 8.76118 9.53687 8.68634 9.34802 8.54726L0.444913 1.97752C0.329075 1.89197 0.231235 1.78445 0.15698 1.66111C0.0827245 1.53777 0.033508 1.40102 0.0121402 1.25868C-0.031014 0.971193 0.0418855 0.678356 0.214802 0.444584C0.387718 0.210811 0.646486 0.0552534 0.934181 0.0121312C1.22188 -0.0309911 1.51493 0.0418545 1.74888 0.214643L10 6.29712L18.2511 0.214643C18.367 0.129087 18.4985 0.0671675 18.6383 0.0324205C18.7781 -0.00232646 18.9234 -0.00922079 19.0658 0.0121312C19.2083 0.0334832 19.3451 0.0826633 19.4685 0.156864C19.592 0.231064 19.6996 0.328831 19.7852 0.444584C19.8708 0.560336 19.9328 0.691806 19.9676 0.831488C20.0023 0.97117 20.0092 1.11633 19.9879 1.25868C19.9665 1.40102 19.9173 1.53777 19.843 1.66111C19.7688 1.78445 19.6709 1.89197 19.5551 1.97752L10.652 8.54726C10.4631 8.68634 10.2346 8.76118 10 8.76077Z"

                      d="M10 14.5093C9.7654 14.5097 9.53687 14.4349 9.34802 14.2958L0.444913 7.72606C0.210967 7.55327 0.0552944 7.29469 0.0121402 7.00721C-0.031014 6.71973 0.0418855 6.42689 0.214802 6.19312C0.387718 5.95935 0.646486 5.80379 0.934181 5.76067C1.22188 5.71754 1.51493 5.79039 1.74888 5.96318L10 12.0457L18.2511 5.96318C18.4851 5.79039 18.7781 5.71754 19.0658 5.76067C19.3535 5.80379 19.6123 5.95935 19.7852 6.19312C19.9581 6.42689 20.031 6.71973 19.9879 7.00721C19.9447 7.29469 19.789 7.55327 19.5551 7.72606L10.652 14.2958C10.4631 14.4349 10.2346 14.5097 10 14.5093Z"
                      fill="#7AE229" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-field">
              <p class="field-label">Assigned to</p>
              <div class="assigned-contact-picker">
              <div class="dropdown-container" id="assigned-to-dropdown">
                <input type="text" class="toggle-task" placeholder="Select contacts to assign"
                  onclick="toggleContactList()" readonly>
                <button type="button" class="assigned-dropdown-btn" onclick="toggleContactList()"><img
                    src="../assets/arrowdropdown.svg" alt="Dropdown arrow"></button>
              </div>
              <ul id="assigned-to-list" class="contact-list"></ul>
              </div>
              <div id="assigned-avatars" class="assigned-avatars"></div>
            </div>
            <div class="form-field">
              <p class="field-label">Category<span class="required-star">*</span></p>
              <div class="dropdown-container">
                <select id="task-category" class="toggle-task">
                  <option value="" selected>Select task category</option>
                  <option value="TechnicalTask">Technical Task</option>
                  <option value="UserStory">User Story</option>
                </select>
                <button type="button"><img src="../assets/arrowdropdown.svg" alt="Dropdown arrow"></button>
              </div>
              <span class="field-error"></span>
            </div>
            <div class="form-field">
              <p class="field-label">Subtasks</p>
              <div class="subtask-wrapper">
                <div class="input-with-icon">
                  <input id="subtaskInput" type="text" placeholder="Add new subtask" oninput="showSubtaskActions()" />
                  <div class="subtask-actions">
                    <button type="button" onclick="rejectSubtask()"><img src="../assets/close.svg"
                        alt="reject subtask"></button>
                    <span class="action-divider"></span>
                    <button type="button" onclick="saveSubtask()"><img src="../assets/check.svg"
                        alt="save subtask"></button>
                  </div>
                </div>
                <ul class="subtask-list"></ul>
              </div>
            </div>
          </div>
        </div>
        <div class="form-footer">
            <div class="error-wrapper">
               <p class="error-message" id="error-message"></p>
            </div>
            <div class="required-and-form-actions">
              <p class="required-hint">
              <span class="required-star">*</span>This field is required
            </p>
            <div class="form-actions">
              <button type="button" class="btn-clear" onclick="resetForm()">
                Clear <span class="icon-close"></span>
              </button>
              <button type="submit" class="btn-create">
                Create Task <span class="icon-check"></span>
              </button>
            </div>
            </div>
          </div>
      </form>
    </div>
  </div>
  <div id="board-task-detail-modal" class="board-detail-modal" inert>
    <div class="board-detail-modal-dialog" role="dialog" aria-modal="true" aria-label="Task details dialog">
      <div id="board-task-detail-root" class="board-detail-modal-body"></div>
    </div>
  </div>
  <div id="task-added-overlay" class="task-added-overlay" role="status" aria-live="polite">
  <div class="task-added-box">
    <span>Task added to board</span>
    <img src="../assets/board-icon.svg" alt="" />
  </div>
</div>
  <template id="board-column-header-template">
    <div class="board-main-column-header">
      <h2 class="board-main-column-title"></h2>
      <button type="button" class="board-main-column-add-button">+</button>
    </div>
  </template>
  <template id="board-column-content-template">
    <div class="board-main-column-content"></div>
  </template>
  <template id="board-empty-hint-template">
    <p class="board-empty-state"></p>
  </template>
  <template id="board-search-empty-template">
    <p class="board-search-empty-state">Keine Ergebnisse gefunden</p>
  </template>
  <template id="board-move-menu-template">
    <div id="board-move-menu" class="board-move-menu" role="menu" aria-label="Move to" hidden>
      <p class="board-move-menu-title">Move to</p>
    </div>
  </template>
  <template id="board-move-option-template">
    <button type="button" role="menuitem"><span aria-hidden="true"></span></button>
  </template>
  <script src="../js/Templates/templateRender.js"></script>
  <script src="../js/Templates/templates.js"></script>
  <script src="../js/addTask/addTaskTemplates.js"></script>
  <script src="../js/addTask/addTask.js"></script>
  <script src="../js/addTask/addTaskSubmit.js"></script>
  <script src="../js/contacts/contactList.js"></script>
  <script src="../js/contacts/contactOwn.js"></script>
  <script src="../js/board/boardData.js"></script>
  <script src="../js/board/boardTaskForm.js"></script>
  <script src="../js/board/boardRender.js"></script>
  <script src="../js/board/boardMove.js"></script>
  <script src="../js/board/boardDetail.js"></script>
  <script src="../js/board/boardLayout.js"></script>
</body>

</html>
