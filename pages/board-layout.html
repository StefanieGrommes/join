<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Layout Start</title>
    <link rel="shortcut icon" href="../assets/join-favicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/board/style.css" />
    <script src="../js/Templates/init.js"></script>
  </head>





  <body onload="init()">
    <div class="page-layout">

      <main aria-label="Board Content">


        <section class="board-header-container" aria-label="Board header container">





          <div class="board-header-inner">
            <h1 class="board-header-title">Board</h1>


            <div class="board-header-actions" aria-label="Board actions">
              <div class="board-search-field">
                <input type="text" placeholder="Find Task" aria-label="Find task" />
                <span class="board-search-divider" aria-hidden="true"></span>
                <button class="board-search-button" type="button" aria-label="Search">
                  <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <circle cx="11" cy="11" r="6"></circle>
                    <path d="M16 16l4 4"></path>
                  </svg>
                </button>
              </div>
              <button id="board-open-add-task-modal" class="board-add-task-button" type="button" aria-label="Add task">
                Add task
                <span class="board-add-task-plus" aria-hidden="true">+</span>
              </button>

            </div>
          </div>







          <div class="board-header-columns" aria-label="Board columns header">
            <div class="board-header-column">
              <div class="board-column-title">
                <span>To do</span>
                <button type="button" data-column="todo" aria-label="Add To do">+</button>
              </div>
            </div>

            <div class="board-header-column">
              <div class="board-column-title">
                <span>In progress</span>
                <button type="button" data-column="in-progress" aria-label="Add In progress">+</button>
              </div>
            </div>

            <div class="board-header-column">
              <div class="board-column-title">
                <span>Await feedback</span>
                <button type="button" data-column="await-feedback" aria-label="Add Await feedback">+</button>
              </div>
            </div>

            <div class="board-header-column">
              <div class="board-column-title">
                <span>Done</span>
              </div>
            </div>
          </div>
        </section>

        <section class="board-main-container" aria-label="Board main container">
            <div class="board-main-column" data-column="todo" aria-label="Todo column"></div>
            <div class="board-main-column" data-column="in-progress" aria-label="In progress column"></div>
            <div class="board-main-column" data-column="await-feedback" aria-label="Await feedback column"></div>
            <div class="board-main-column extra-done" data-column="done" aria-label="Done column"></div>
        </section>



      </main>

    </div>

    <div class="board-mobile-top-nav" aria-label="Mobile top navigation">
      <div class="board-mobile-logo-wrapper">
        <img src="../assets/join-favicon.svg" alt="Join logo" />
      </div>

      <button class="board-mobile-profile-button" type="button" aria-label="Profile">
        <svg class="board-mobile-profile-circle" width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="28" cy="28" r="26.5" stroke="#2A3647" stroke-width="3" />
        </svg>
      </button>
    </div>

    <div id="board-add-task-modal" class="board-task-modal" aria-hidden="true">
      <div class="board-task-dialog" role="dialog" aria-modal="true" aria-labelledby="board-task-dialog-title">
        <div class="board-task-header">
          <h2 id="board-task-dialog-title">Add Task</h2>
          <button id="board-task-close-button" class="board-task-close" type="button" aria-label="Close add task dialog">×</button>
        </div>

        <form id="board-task-form" class="board-task-form">
          <div class="board-task-form-column board-task-form-column--left">
            <label class="board-task-label" for="board-task-title">Title</label>
            <input id="board-task-title" class="board-task-input" type="text" placeholder="Enter a title" />

            <label class="board-task-label" for="board-task-description">Description</label>
            <textarea id="board-task-description" class="board-task-textarea" placeholder="Enter a description"></textarea>

            <label class="board-task-label" for="board-task-date">Due date</label>
            <div class="board-task-date-wrap">
              <input id="board-task-date" class="board-task-input" type="date" />
            </div>
          </div>

          <div class="board-task-form-column board-task-form-column--right">
            <label class="board-task-label" for="board-task-priority">Priority</label>
            <select id="board-task-priority" class="board-task-select">
              <option value="">Urgent</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="Urgent">Urgent</option>
            </select>

            <label class="board-task-label" for="board-task-assigned">Assigned to</label>
            <select id="board-task-assigned" class="board-task-select" multiple size="5">
              <option value="EM">Emanuel Mauer</option>
              <option value="MB">Marcel Bauer</option>
              <option value="AM">Anton Mayer</option>
              <option value="SM">Sofia Müller</option>
              <option value="BZ">Benedikt Ziegler</option>
              <option value="JJ">Jasper Jäger</option>
            </select>

            <label class="board-task-label" for="board-task-category">Category</label>
            <select id="board-task-category" class="board-task-select">
              <option value="">Select task category</option>
              <option value="User Story">User Story</option>
              <option value="Technical Task">Technical Task</option>
            </select>

            <label class="board-task-label" for="board-task-subtask">Subtasks</label>
            <input id="board-task-subtask" class="board-task-input" type="text" placeholder="Add new subtask" />
          </div>
        </form>

        <div class="board-task-footer">
          <div class="board-task-actions">
            <button id="board-task-cancel-button" class="board-task-cancel" type="button">Cancel</button>
            <button id="board-task-save-button" class="board-task-save" type="button" disabled>Create Task</button>
          </div>
        </div>
      </div>
    </div>

    <div id="board-task-detail-modal" class="board-detail-modal" aria-hidden="true">
      <div class="board-detail-modal-dialog" role="dialog" aria-modal="true" aria-label="Task details dialog">
        <div id="board-task-detail-root" class="board-detail-modal-body"></div>
      </div>
    </div>

    <script src="../js/data/contacts.js"></script>
    <script src="../js/data/app-data.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/Templates/templates.js"></script>
    <script src="../js/board/board-layout.js"></script>
  </body>





</html>
