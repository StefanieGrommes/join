<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Layout Start</title>
    <link rel="stylesheet" href="./board-layout.css" />
  </head>





  <body>
    <div class="page-layout">
      <aside class="sidebar" aria-label="Navigation Sidebar">
        <div class="sidebar-logo-container">
          <img class="sidebar-logo" src="../img/icons/join-icon-white.png" alt="Join logo" />
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a class="sidebar-nav-item" href="#" aria-label="Summary">
            <span class="sidebar-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="3" y="3" width="8" height="8" rx="1"></rect>
                <rect x="13" y="3" width="8" height="18" rx="1"></rect>
                <rect x="3" y="13" width="8" height="8" rx="1"></rect>
              </svg>
            </span>
            <span class="sidebar-nav-label">Summary</span>
          </a>

          <a class="sidebar-nav-item" href="#" aria-label="Add Task">
            <span class="sidebar-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4 16.5V20h3.5L18 9.5 14.5 6 4 16.5z"></path>
                <path d="M13.5 7l3.5 3.5"></path>
              </svg>
            </span>
            <span class="sidebar-nav-label">Add Task</span>
          </a>

          <a class="sidebar-nav-item sidebar-nav-item--active" href="#" aria-label="Board">
            <span class="sidebar-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="3" y="4" width="5" height="16" rx="1"></rect>
                <rect x="10" y="4" width="5" height="16" rx="1"></rect>
                <rect x="17" y="4" width="4" height="16" rx="1"></rect>
              </svg>
            </span>
            <span class="sidebar-nav-label">Board</span>
          </a>

          <a class="sidebar-nav-item" href="#" aria-label="Contacts">
            <span class="sidebar-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="12" cy="9" r="3.5"></circle>
                <path d="M5 20v-2c0-2.8 2.8-4.5 7-4.5s7 1.7 7 4.5v2"></path>
              </svg>
            </span>
            <span class="sidebar-nav-label">Contacts</span>
          </a>
        </nav>

        <div class="sidebar-footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Legal notice</a>
        </div>
      </aside>

      <main class="board-content" aria-label="Board Content">


        <header class="board-top-container" aria-label="Board top container">
          <div class="board-top-inner">
            <p class="board-top-title">Kanban Project Management Tool</p>

            <div class="board-top-actions" aria-label="Top actions">
              <button class="board-top-help-button" type="button" aria-label="Help">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <circle cx="12" cy="12" r="8"></circle>
                  <path d="M9.8 9.6a2.2 2.2 0 1 1 3.8 1.5c-.6.6-1.3 1-1.3 2"></path>
                  <circle cx="12" cy="16.7" r=".6"></circle>
                </svg>
              </button>

              <button class="board-top-profile-button" type="button" aria-label="Profile">
                SM
              </button>
            </div>
          </div>
        </header>

        <section class="board-header-container" aria-label="Board header container">
          <div class="board-header-inner">
            <h1 class="board-header-title">Board</h1>

            <div class="board-header-actions" aria-label="Board actions">
              <div class="board-search-field">
                <input type="text" placeholder="Find Task" aria-label="Find task" />
                <span class="board-search-divider" aria-hidden="true"></span>
                <button class="board-search-button" type="button" aria-label="Search">
                  <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <circle cx="11" cy="11" r="6"></circle>
                    <path d="M16 16l4 4"></path>
                  </svg>
                </button>
              </div>

              <button class="board-add-task-button" type="button" aria-label="Add task">
                Add task
                <span class="board-add-task-plus" aria-hidden="true">+</span>
              </button>
            </div>
          </div>
        </section>

        <section class="board-main-container" aria-label="Board main container">
            
            <div class="board-main-column" data-column="todo" aria-label="Todo column">
                <div class="board-card board-card--todo" data-card-id="todo-card" draggable="true" aria-label="Todo card"></div>
            </div>

            <div class="board-main-column" data-column="in-progress" aria-label="In progress column">
                <div class="board-card board-card--in-progress" data-card-id="in-progress-card" draggable="true" aria-label="In progress card"></div>
            </div>

            <div class="board-main-column" data-column="await-feedback" aria-label="Await feedback column">
                <div class="board-card board-card--await-feedback" data-card-id="await-feedback-card" draggable="true" aria-label="Await feedback card"></div>
            </div>

            <div class="board-main-column" data-column="done" aria-label="Done column">
                <div class="board-card board-card--done" data-card-id="done-card" draggable="true" aria-label="Done card"></div>
            </div>

        </section>



      </main>


    </div>
    <script src="./board-layout.js"></script>
  </body>





</html>
