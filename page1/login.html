<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./login.css" />
  </head>






  <body>
  <div class="page login-page">
      <div class="app-intro" aria-hidden="true">
        <div class="join-logo" aria-label="Join logo">
          <img class="join-preview" src="../img/icons/join_icon.png" alt="Join logo" />
        </div>
      </div>









      <header class="page-header">
        <img class="header-icon" src="../img/icons/join_icon.png" alt="Join icon" />
        <div class="header-actions">
          <span class="header-copy">Not a Join user?</span>
          <button type="button" class="top-link">Sign up</button>
        </div>
      </header>




      <main class="login-shell">
        <section class="content-card" aria-labelledby="login-title">
          <h1 id="login-title" class="login-title">Log in</h1>

          <div class="login-form">
            <div class="field input-with-icon">
              <input type="email" placeholder="Email" />
              <img src="../img/icons/mail.png" alt="Mail icon" class="input-icon" />
            </div>
            <div class="field input-with-icon">
              <input type="password" placeholder="Password" />
              <img src="../img/icons/lock.png" alt="Lock icon" class="input-icon" />
            </div>

            <div class="button-row">
              <button type="submit" class="btn btn--primary">Log in</button>
              <button type="button" class="btn btn--secondary">Guest Log in</button>
            </div>
          </div>
        </section>
      </main>

    



  <footer class="footer">
        <a href="#">Privacy Policy</a>
        <a href="#">Legal notice</a>
  </footer>





  </body>






    <script src="./login.js"></script>



</html>
