<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Home</title>
    <style>
      :root {
        --sidebar-bg: #2f3c4d;
        --sidebar-bg-dark: #243446;
        --main-bg: #dfe3e6;
        --panel-bg: #f3f3f3;
        --text: #1d2733;
        --muted: #5a6673;
        --line: #e6e8ea;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--main-bg);
        font-family: "Inter", Arial, sans-serif;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }

      .app-shell {
        width: min(1200px, 100%);
        min-height: 760px;
        display: flex;
        background: rgba(255,255,255,0.12);
      }

      .sidebar {
        width: 180px;
        background: linear-gradient(180deg, #2d3b4f 0%, #27384a 100%);
        padding: 18px 12px 18px;
        border-radius: 18px 0 0 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .brand {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 2.6rem;
        font-weight: 800;
        color: white;
        margin-bottom: 20px;
        background: rgba(255,255,255,0.04);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      }

      .nav {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.9);
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 0.8rem;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.12s ease, transform 0.12s ease, opacity 0.12s ease;
      }

      .nav-item:hover,
      .nav-item:focus-visible {
        background: rgba(255,255,255,0.08);
        transform: translateX(1px);
      }

      .nav-item.is-active {
        background: rgba(255,255,255,0.09);
      }

      .nav-icon {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.08);
        color: #ffffff;
        font-size: 0.7rem;
      }

      .sidebar-footer {
        margin-top: auto;
        width: 100%;
        display: grid;
        gap: 8px;
        padding-top: 14px;
      }

      .sidebar-footer a {
        color: rgba(255,255,255,0.7);
        font-size: 0.7rem;
        text-decoration: none;
        padding-left: 10px;
      }

      .content {
        flex: 1;
        background: rgba(255,255,255,0.12);
        border-radius: 0 18px 18px 0;
        padding: 20px 30px;
      }

      .empty-panel {
        width: 100%;
        height: 100%;
        min-height: 680px;
        background: rgba(255,255,255,0.7);
        border-radius: 16px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.08);
        border: 1px solid rgba(0,0,0,0.03);
      }

      @media (max-width: 700px) {
        body { padding: 12px; }
        .app-shell { flex-direction: column; }
        .sidebar { width: 100%; border-radius: 18px 18px 0 0; }
        .content { border-radius: 0 0 18px 18px; padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">J</div>
        <nav class="nav" aria-label="Navigation">
          <button class="nav-item is-active" type="button"><span class="nav-icon">▣</span><span>Summary</span></button>
          <button class="nav-item" type="button"><span class="nav-icon">＋</span><span>Add Task</span></button>
          <button class="nav-item" type="button"><span class="nav-icon">▦</span><span>Board</span></button>
          <button class="nav-item" type="button"><span class="nav-icon">◉</span><span>Contacts</span></button>
        </nav>
        <div class="sidebar-footer">
          <a href="./help.html">Help</a>
          <a href="./privacy-notice.html">Privacy Policy</a>
          <a href="./legal-notice.html">Legal notice</a>
        </div>
      </aside>

      <main class="content">
        <div class="empty-panel" aria-label="Leerer Home-Bereich"></div>
      </main>
    </div>
  </body>
</html>
